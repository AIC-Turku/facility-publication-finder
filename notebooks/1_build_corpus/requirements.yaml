dependencies:
- pyyaml==6.0.2
- pymupdf==1.28.2
- fastembed==0.8.1
- scikit-learn==1.9.1
- numpy==2.4.6
- openpyxl==3.1.5
- ipywidgets==8.1.7
description: Facility publication finder, notebook 1 (Build the corpus). For each chosen year it
  finds every candidate paper (the facility's institutional repositories and Europe PMC), fetches
  its full text, screens it with the facility's rules and embeds it for the similarity ranking.
  Everything is kept in the chosen working-data folder and the run can be resumed. The rules and
  confirmed papers are downloaded from GitHub at each start.
linux_dependencies: []
macos_dependencies: []
python_version: 3.11.11
windows_dependencies: []
