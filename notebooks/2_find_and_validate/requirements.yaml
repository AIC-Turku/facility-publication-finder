dependencies:
- pyyaml==6.0.2
- pymupdf==1.28.2
- fastembed==0.8.1
- scikit-learn==1.9.1
- numpy==2.4.6
- ipywidgets==8.1.7
description: Facility publication finder, notebook 2 (Find and validate). For a year built with
  notebook 1 it applies the current rules, ranks the papers, and lets staff review them one by
  one (yes / likely / no, saved at each click); it then writes the corresponding authors of the
  confirmed papers to contacts.csv, gives the link to file the confirmed DOIs on GitHub, and
  learns from the decisions. The rules and confirmed papers are downloaded from GitHub at each start.
linux_dependencies: []
macos_dependencies: []
python_version: 3.11.11
windows_dependencies: []
