dependencies:
- pyyaml==6.0.2
- pymupdf==1.28.2
- fastembed==0.8.1
- scikit-learn==1.9.1
- numpy==2.4.6
- openpyxl==3.1.5
- ipywidgets==8.1.7
description: Facility publication finder - find the publications that used a core facility.
  Notebook 1 builds a year (candidate papers from the institutional repositories and Europe
  PMC, their full text, the facility rules, the similarity ranking); notebook 2 reviews the
  papers one by one, writes the corresponding authors of the confirmed papers to contacts.csv
  and gives the link to file the confirmed DOIs. The package (src/facility_pubs) needs no
  other dependency; the rules and confirmed papers are downloaded from GitHub at each start.
linux_dependencies: []
macos_dependencies: []
python_version: 3.11.11
windows_dependencies: []
