[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "facility-pubs"
version = "0.1.0"
description = "Find publications that used a core imaging facility, starting from institutional repositories."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyyaml", "pymupdf"]

[project.optional-dependencies]
embed = ["fastembed", "scikit-learn"]        # the embedding check list
openiris = ["openpyxl"]                      # private OpenIRIS admin export import
notebook = ["ipywidgets"]                    # the notebooks outside Colab (Colab has it)
test = ["pytest", "numpy", "scikit-learn", "openpyxl", "ruff", "ipywidgets"]

[project.scripts]
facility-pubs = "facility_pubs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "SIM"]
ignore = ["UP006", "UP035", "B905", "B904", "B007", "SIM102", "SIM105", "SIM108", "SIM115"]
