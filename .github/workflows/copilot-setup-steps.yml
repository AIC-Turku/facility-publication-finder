name: copilot setup steps

# Prepares the environment of GitHub's coding agent (assign an issue to Copilot, with any model):
# the package is installed, so the agent can run `facility-pubs add-papers` (see AGENTS.md).
on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/copilot-setup-steps.yml"]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
