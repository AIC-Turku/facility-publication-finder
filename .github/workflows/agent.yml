name: agent

# `@claude` in an issue or pull-request comment runs Claude Code on this repository, following
# AGENTS.md (e.g. "Filing papers from an issue"). Only people with write access can trigger it.
# Needs one repository secret: ANTHROPIC_API_KEY (API, paid per run) or CLAUDE_CODE_OAUTH_TOKEN
# (a Claude subscription; `claude setup-token`), and the Claude GitHub App installed.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --allowedTools "Bash(facility-pubs:*)"
