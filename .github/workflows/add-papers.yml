name: add papers

# Paste confirmed DOIs into facilities/<facility>/inbox.txt and commit: this workflow
# fetches their metadata, files them under papers/<year>.yaml, merges duplicates, sorts
# the files and empties the inbox. DOIs it cannot file stay in the inbox with a note, and
# the run fails so that GitHub e-mails whoever committed (the summary shows what happened).
on:
  push:
    branches: [main]
    paths: ["facilities/*/inbox.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-papers
  cancel-in-progress: false

jobs:
  file-papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: File the pasted papers
        run: |
          for dir in facilities/*/; do
            name=$(basename "$dir")
            [ "$name" = template ] && continue
            [ -f "$dir/inbox.txt" ] || continue
            facility-pubs add-papers --facility "$name" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facilities
          if git diff --cached --quiet; then
            echo "nothing to file"
            exit 0
          fi
          git commit -m "File confirmed papers from the inbox"
          for attempt in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 5
          done
          echo "could not push (main kept moving): run this workflow again" && exit 1
      - name: Anything left in an inbox?
        run: |
          if grep -hv '^#' facilities/*/inbox.txt | grep -q .; then
            echo "Some lines could not be filed; they are in the inbox with a note:" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -Hv '^#' facilities/*/inbox.txt | grep -v ':$' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
